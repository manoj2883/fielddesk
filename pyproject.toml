[project]
name = "fielddesk"
version = "0.1.0"
description = "Triage agent for dealer-to-manufacturer support tickets (fictional OEM: Ridgeline Equipment)"
readme = "README.md"
authors = [
    { name = "manoj2883", email = "manojgangineni123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.17.0",
    "fastapi>=0.156.4",
    "httpx>=0.28.1",
    "langgraph>=1.2,<1.3",
    "numpy>=2.5.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["plans"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "N"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"evals/**" = ["S311"]
"data/generator/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
files = ["src/fielddesk"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "fielddesk.schemas"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "aiosqlite.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket -m 'not live' --strict-markers"
markers = ["live: calls the real Anthropic API; run with RUN_LIVE=1 make test-live"]

[tool.coverage.run]
source = ["src/fielddesk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
